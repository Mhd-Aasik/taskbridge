name: tests

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    environment: Testing

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: taskbridge_ci_registration
          MARIADB_USER: taskbridge_ci
          MARIADB_PASSWORD: ci-only-disposable-password
          MARIADB_ROOT_PASSWORD: ci-only-disposable-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: mbstring, gd, exif, pdo_sqlite, pdo_mysql, intl, zip
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci --no-audit --no-fund

      - name: Create SQLite Database
        run: touch database/database.sqlite

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: npm run build

      - name: Test secure account-link initialization
        run: node --test tests/JavaScript/*.test.mjs

      - name: Run Tests
        run: ./vendor/bin/phpunit

      - name: Test concurrent registration on disposable MariaDB
        env:
          TASKBRIDGE_RACE_MYSQL: '1'
        run: ./vendor/bin/phpunit tests/Feature/Auth/RegistrationConcurrencyTest.php
